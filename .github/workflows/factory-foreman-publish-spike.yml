# Spike S2, S3 and S6 for factory-foreman's publish workflow. It runs only from
# the default branch (the environment allows main only), mints a short-lived App
# token from the environment's secret, and acts as the App. Inputs reach the
# scripts through environment variables, never interpolated into run lines.
name: factory-foreman publish (spike)
run-name: "factory-foreman ${{ inputs.operation }} ${{ inputs.correlation }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "artifact | open-pr | link-stack | merge"
        required: true
      issue:
        description: Issue number (artifact)
        required: false
      head:
        description: Head branch (open-pr), or the approved head SHA (merge)
        required: false
      base:
        description: Base branch (open-pr, link-stack)
        required: false
      prs:
        description: PR numbers, bottom first, space-separated (link-stack)
        required: false
      pr:
        description: Slice PR number (merge)
        required: false
      patch_id:
        description: The approved diff's patch id (merge)
        required: false
      approver:
        description: The approving person's account id (merge)
        required: false
      message_id:
        description: The chat message or card that approved it (merge)
        required: false
      correlation:
        description: Correlation id
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: factory-foreman-publish
    steps:
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FF_APP_ID }}
          private-key: ${{ secrets.FF_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: Act as the App
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OP: ${{ inputs.operation }}
          ISSUE: ${{ inputs.issue }}
          HEAD_BRANCH: ${{ inputs.head }}
          BASE_BRANCH: ${{ inputs.base }}
          PRS: ${{ inputs.prs }}
          PR: ${{ inputs.pr }}
          PATCH_ID: ${{ inputs.patch_id }}
          APPROVER: ${{ inputs.approver }}
          MESSAGE_ID: ${{ inputs.message_id }}
          CORRELATION: ${{ inputs.correlation }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$OP" in
            artifact)
              [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "issue must be a number"; exit 1; }
              python3 - <<'PY'
          import struct, zlib
          def png(path, rgb):
              raw = b''.join(b'\x00' + bytes(rgb) * 120 for _ in range(60))
              c = lambda t, d: struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              open(path, 'wb').write(b'\x89PNG\r\n\x1a\n' + c(b'IHDR', struct.pack('>IIBBBBB', 120, 60, 8, 2, 0, 0, 0)) + c(b'IDAT', zlib.compress(raw)) + c(b'IEND', b''))
          png('before.png', (200, 60, 60)); png('after.png', (60, 160, 60))
          PY
              gh issue artifact create "$ISSUE" --name "S6 as the App" --body "Posted by the publish workflow for $ACTOR ($CORRELATION)." --attach "before.png#Before" --attach "after.png#After"
              ;;
            open-pr)
              [[ "$HEAD_BRANCH" =~ ^[A-Za-z0-9._/-]+$ && "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad branch name"; exit 1; }
              gh pr create --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title "Spike S2: PR opened by the App" --body "Opened by the publish workflow for $ACTOR ($CORRELATION)."
              ;;
            link-stack)
              [[ "$PRS" =~ ^[0-9\ ]+$ && "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad input"; exit 1; }
              gh extension install github/gh-stack
              # shellcheck disable=SC2086
              gh stack link --base "$BASE_BRANCH" $PRS
              ;;
            merge)
              # S3: merge a slice after the person's approval in chat. The approval
              # travels as this run's inputs (GitHub records who started the run); the
              # issue is the only record, so there's no trail branch to read.
              [[ "$PR" =~ ^[0-9]+$ && "$HEAD_BRANCH" =~ ^[0-9a-f]{40}$ && "$PATCH_ID" =~ ^[0-9a-f]{40}$ ]] || { echo "pr must be a number, head and patch_id 40 hex"; exit 1; }
              [[ "$APPROVER" =~ ^[A-Za-z0-9_-]{1,100}$ && "$MESSAGE_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || { echo "approver and message_id must be ids"; exit 1; }
              base=$(gh pr view "$PR" --json baseRefName -q .baseRefName); now=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
              [[ "$now" == "$HEAD_BRANCH" ]] || { echo "the PR's head is $now now, not the approved $HEAD_BRANCH"; exit 1; }
              git fetch -q origin "$base" "$now"
              actual=$(git diff "origin/$base...$now" | git patch-id --stable | cut -d' ' -f1)
              [[ "$actual" == "$PATCH_ID" ]] || { echo "the approved diff ($PATCH_ID) isn't the PR's diff now ($actual)"; exit 1; }
              echo "Approved by $APPROVER in chat ($MESSAGE_ID); merging PR $PR at $now for $ACTOR"
              gh extension install github/gh-stack
              gh stack checkout "$PR"
              gh stack merge "$PR" --squash --yes
              ;;
            *) echo "unknown operation"; exit 1 ;;
          esac
